# Render Blueprint: one web service (API + built React app) and a managed PostgreSQL database.
databases:
  - name: campusfix-db
    plan: free
    databaseName: campusfix
    user: campusfix

services:
  - type: web
    name: campusfix
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusfix-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
